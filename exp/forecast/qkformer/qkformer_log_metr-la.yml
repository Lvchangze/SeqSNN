_base_:
- ../dataset/metr-la.yml
_custom_imports_:
- SeqSNN.network
- SeqSNN.dataset
- SeqSNN.runner

data:
  raw_label: False
  window: 12
  horizon: 24
  normalize: 2

runner:
  type: ts
  task: regression
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  loss_fn: mse
  metrics: [r2, rse]
  observe: loss
  lower_is_better: True
  max_epoches: 1000
  early_stop: 30
  batch_size: 16
  aggregate: True

network:
  type: QKFormer_XNOR_Log
  dim: 256
  d_ff: 1024
  depths: 4
  num_steps: 4
  heads: 8
  pe_type: conv

runtime:
  seed: 42